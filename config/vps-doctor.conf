# VPS Doctor configuration
# Copy to /etc/vps-doctor/config.conf to customize a system installation.

# Comma-separated hostnames. Leave empty to skip outbound DNS/TLS checks.
DOMAINS=""

# Percentage thresholds.
DISK_WARN=85
DISK_FAIL=95
MEMORY_WARN=15

# Warn after this many matching SSH authentication log entries in 24 hours.
AUTH_FAILURE_WARN=100
