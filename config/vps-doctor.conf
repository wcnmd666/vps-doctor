# VPS Doctor configuration
# Copy to /etc/vps-doctor/config.conf to customize a system installation.

# Comma-separated hostnames. Leave empty to skip outbound DNS/TLS checks.
DOMAINS=""

# Percentage thresholds. Values must be 1-100 and DISK_WARN must be lower than DISK_FAIL.
DISK_WARN=85
DISK_FAIL=95
MEMORY_WARN=15

# Warn after this many matching SSH authentication log entries in 24 hours.
AUTH_FAILURE_WARN=100

# Optional semicolon-separated exclusions. Every exclusion must use a known stable rule ID
# and include a reason. Excluded findings remain visible as SKIP results in reports.
# Example: EXCLUDE_RULES="WEB-002=No public domain on this host;STO-003=Ephemeral test VM"
EXCLUDE_RULES=""
