name: Bug report
description: Report an incorrect result or runtime failure
title: "[bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Remove credentials and review all logs/reports before posting."
  - type: input
    id: version
    attributes:
      label: VPS Doctor version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID or command
      placeholder: STO-001 or vps-doctor scan --quick
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted evidence
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the submission and removed secrets and private infrastructure data.
          required: true
