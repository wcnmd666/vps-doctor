name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Bash ${{ matrix.bash }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bash: ['4.4', '5.2']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Syntax check and unit tests
        run: >-
          docker run --rm
          -v "$PWD:/work"
          -w /work
          bash:${{ matrix.bash }}
          -c "apk add --no-cache coreutils findutils grep sed gawk util-linux >/dev/null &&
          bash -n bin/vps-doctor install.sh uninstall.sh lib/*.sh checks/*.sh fixes/*.sh tests/*.sh scripts/*.sh &&
          bash tests/run.sh"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck -x bin/vps-doctor install.sh uninstall.sh lib/*.sh checks/*.sh fixes/*.sh tests/*.sh scripts/*.sh

  smoke:
    name: Ubuntu smoke scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run read-only quick scan
        run: sudo bash bin/vps-doctor scan --quick --no-color --format json --output report.json
      - name: Validate JSON
        run: python3 -m json.tool report.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-report
          path: report.json
          if-no-files-found: error
          retention-days: 7
