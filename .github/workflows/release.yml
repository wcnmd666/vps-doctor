name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test and package
        run: make package
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading refreshed artifacts."
            gh release upload "$GITHUB_REF_NAME" \
              dist/vps-doctor-*.tar.gz \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/vps-doctor-*.tar.gz \
              dist/SHA256SUMS \
              --generate-notes
          fi
